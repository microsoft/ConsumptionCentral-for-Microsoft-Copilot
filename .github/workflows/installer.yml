name: installer

# Tests the Consumption Central installer and builds ConsumptionCentralInstaller.exe, the download
# that runs it without a clone of this repo or a terminal, and install.ps1 with
# ConsumptionCentralInstaller.zip, which run the same payload from PowerShell for organisations that
# block downloaded exes. The payload is the installer, the Fabric and Viva Direct files it deploys,
# as installer-assets.json lists them, the app (built here) and the managed apps CLI that deploys it
# (see installer/packaging/payload.js). A tag such as consumption-central-installer-v0.1.0 also
# drafts a release with them, to publish by hand: this workflow never publishes one.
#
# Signing: the exe and install.ps1 aren't code-signed yet. Analytics Hub signs its exe with ESRP from
# an internal pipeline, which follows here once this repo is onboarded (see installer/UPSTREAM.md).
# Publishing a release runs the check below. With the repo variable REQUIRE_SIGNED_INSTALLER set to
# true, it turns an unsigned release back into a draft, so no one downloads it.
#
# GitHub's Latest release is left to report releases, so an installer release is never marked
# Latest and every installer link names its version. Publishing one warns if it became Latest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Tag pushes ignore the paths below.
    tags: ['consumption-central-installer-v*']
    paths:
      - 'installer/**'
      # What the payload carries and the tests read: the manifest, the Fabric notebooks and
      # template, the Viva Direct template with the query the PAX route swaps in, and the app.
      - 'installer-assets.json'
      - '2. Fabric/notebooks/**'
      - '2. Fabric/Consumption Central - Fabric.pbit'
      - '3. Viva Direct/Consumption Central - Viva Direct.pbit'
      - '3. Viva Direct/SourceFiles.SharePoint.m'
      - 'app/**'
      # The install guide, whose commands and links the tests check.
      - 'docs/INSTALL.md'
      - '.github/workflows/installer.yml'
  # Every base, so stacked pull requests are tested too.
  pull_request:
    paths:
      - 'installer/**'
      - 'installer-assets.json'
      - '2. Fabric/notebooks/**'
      - '2. Fabric/Consumption Central - Fabric.pbit'
      - '3. Viva Direct/Consumption Central - Viva Direct.pbit'
      - '3. Viva Direct/SourceFiles.SharePoint.m'
      - 'app/**'
      - 'docs/INSTALL.md'
      - '.github/workflows/installer.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test the installer
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'installer'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The lock file may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        run: node packaging/public-registry.js package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # The PAX scripts' tests run them with PowerShell 7, and skip without it.
      - name: Check that PowerShell 7 is available
        run: pwsh -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required" }'
      # The notebooks that ship with the installer (assets/) and the PAX scripts. Some tests run
      # Node.js, so after npm ci.
      - name: Test the installer's notebooks and PAX scripts
        run: python -m unittest discover -s test/python -p "test_*.py"

  test-windows:
    name: Test the PAX scripts on Windows
    if: github.event_name != 'release'
    # The PAX route's refresh, scheduled task and credential scripts run on Windows, and some of
    # their tests skip elsewhere.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'installer'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check that PowerShell 7 can run the scripts
        # The tests skip, rather than bypass, an execution policy that blocks local scripts.
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required' }
          $policy = Get-ExecutionPolicy
          if ($policy -in 'Restricted', 'AllSigned') { throw "The execution policy is $policy, so the PAX script tests would skip." }
      - name: Test the PAX scripts
        run: python -B -m unittest discover -s test/python -p "test_*pax*.py"

  build:
    name: Build the installer exe
    if: github.event_name != 'release'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The managed apps CLI needs Node.js 24.11 or later, and the exe ships the Node.js that builds it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the tag matches the installer's version
        if: startsWith(github.ref, 'refs/tags/consumption-central-installer-v')
        working-directory: 'installer'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "consumption-central-installer-v$version") { throw "Tag $env:TAG doesn't match the installer's version $version." }

      # The lock files may resolve through Microsoft's internal mirror of npm, which runners can't reach.
      - name: Use the public npm registry
        working-directory: 'installer'
        run: node packaging/public-registry.js "../app/package-lock.json" package-lock.json managed-cli/package-lock.json

      - name: Install the app's dependencies
        working-directory: 'app'
        run: npm ci --no-audit --no-fund

      - name: Install the installer's dependencies
        working-directory: 'installer'
        run: npm ci --no-audit --no-fund

      - name: Test the installer
        working-directory: 'installer'
        run: npm test

      - name: Type-check the installer
        working-directory: 'installer'
        run: npm run typecheck

      - name: Build the exe
        working-directory: 'installer'
        run: npm run build:exe -- --release --out "${{ runner.temp }}\exe"

      - name: Smoke-test the exe
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'exe\ConsumptionCentralInstaller.exe'
          & $exe --version
          if ($LASTEXITCODE) { throw "--version failed with exit code $LASTEXITCODE." }
          # preview signs in to nothing: it writes what would be deployed, from the payload's files.
          $preview = Join-Path $env:RUNNER_TEMP 'preview'
          & $exe preview --config (Join-Path $env:RUNNER_TEMP 'smoke.json') --out $preview
          if ($LASTEXITCODE) { throw "preview failed with exit code $LASTEXITCODE." }
          foreach ($f in 'pipeline-content.json', 'model.bim') {
            if (-not (Test-Path -LiteralPath (Join-Path $preview $f))) { throw "preview wrote no $f." }
          }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $preview 'notebooks') -Filter '*.ipynb')) { throw 'preview wrote no notebooks.' }
          # The PAX route: the scheduled task's settings and the scripts it runs.
          $pax = Join-Path $env:RUNNER_TEMP 'preview-pax'
          & $exe preview --target pax --config (Join-Path $env:RUNNER_TEMP 'smoke-pax.json') --out $pax
          if ($LASTEXITCODE) { throw "preview --target pax failed with exit code $LASTEXITCODE." }
          foreach ($f in 'refresh.json', 'scripts\refresh.ps1', 'scripts\Run-PAX-AIBV.ps1') {
            if (-not (Test-Path -LiteralPath (Join-Path $pax $f))) { throw "preview --target pax wrote no $f." }
          }

      # Unpacks into its own LOCALAPPDATA, so it doesn't reuse what the exe unpacked above.
      - name: Smoke-test install.ps1
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'exe'
          $zip = Join-Path $out 'ConsumptionCentralInstaller.zip'
          $script = Join-Path $out 'install.ps1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ps-local'
          & $script -ZipPath $zip --version
          if ($LASTEXITCODE) { throw "install.ps1 --version failed with exit code $LASTEXITCODE." }
          & (Join-Path $env:LOCALAPPDATA 'ConsumptionCentral\consumption-central.cmd') --version
          if ($LASTEXITCODE) { throw "consumption-central.cmd --version failed with exit code $LASTEXITCODE." }
          # Windows PowerShell 5.1 in Constrained Language Mode, as on a locked-down PC, through iex.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ps-clm'
          $env:CONSUMPTION_CENTRAL_ZIP = $zip
          $env:INSTALL_PS1 = $script
          powershell.exe -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode = ''ConstrainedLanguage''; $s = Get-Content -Raw $env:INSTALL_PS1; iex (''& {'' + [char]10 + $s + [char]10 + ''} --version''); exit $LASTEXITCODE'
          if ($LASTEXITCODE) { throw "install.ps1 in Constrained Language Mode failed with exit code $LASTEXITCODE." }
          # -UseInstalledNode: runs with the Node.js from setup-node instead of the one in the zip.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ps-installed'
          & $script -ZipPath $zip -UseInstalledNode --version
          if ($LASTEXITCODE) { throw "install.ps1 -UseInstalledNode failed with exit code $LASTEXITCODE." }
          $cmd = Join-Path $env:LOCALAPPDATA 'ConsumptionCentral\consumption-central.cmd'
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          if (-not (Select-String -Path $cmd -SimpleMatch "set `"CC_NODE=$node`"" -Quiet)) { throw "consumption-central.cmd doesn't use $node." }
          & $cmd --version
          if ($LASTEXITCODE) { throw "consumption-central.cmd --version (installed Node.js) failed with exit code $LASTEXITCODE." }
          # Exercise the installed-Node route in Windows PowerShell 5.1 CLM as well.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ps-installed-clm'
          $env:CONSUMPTION_CENTRAL_USE_INSTALLED_NODE = '1'
          powershell.exe -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode = ''ConstrainedLanguage''; $s = Get-Content -Raw $env:INSTALL_PS1; iex (''& {'' + [char]10 + $s + [char]10 + ''} --version''); exit $LASTEXITCODE'
          if ($LASTEXITCODE) { throw "install.ps1 -UseInstalledNode in Constrained Language Mode failed with exit code $LASTEXITCODE." }
          $cmd = Join-Path $env:LOCALAPPDATA 'ConsumptionCentral\consumption-central.cmd'
          if (-not (Select-String -Path $cmd -SimpleMatch "set `"CC_NODE=$node`"" -Quiet)) { throw "consumption-central.cmd (CLM) doesn't use $node." }
          & $cmd --version
          if ($LASTEXITCODE) { throw "consumption-central.cmd --version (installed Node.js, CLM) failed with exit code $LASTEXITCODE." }
          $env:CONSUMPTION_CENTRAL_USE_INSTALLED_NODE = $null

      # Run on the exe that gets published, after any signing: signing changes the hash.
      - name: Check the signature, write the hash and the release notes
        working-directory: 'installer'
        run: node packaging/finish-exe.js "${{ runner.temp }}\exe\ConsumptionCentralInstaller.exe" --notes "${{ runner.temp }}\release-notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ConsumptionCentralInstaller
          path: |
            ${{ runner.temp }}\exe\ConsumptionCentralInstaller.exe
            ${{ runner.temp }}\exe\ConsumptionCentralInstaller.exe.sha256
            ${{ runner.temp }}\exe\ConsumptionCentralInstaller.zip
            ${{ runner.temp }}\exe\ConsumptionCentralInstaller.zip.sha256
            ${{ runner.temp }}\exe\install.ps1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}\release-notes.md
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [test, test-windows, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/consumption-central-installer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ConsumptionCentralInstaller
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release candidate such as consumption-central-installer-v0.1.0-rc.1 is a pre-release,
          # which the installer's update check skips. --latest=false: Latest is for report releases.
          pre=()
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then pre=(--prerelease); fi
          gh release create "$TAG" ConsumptionCentralInstaller.exe ConsumptionCentralInstaller.exe.sha256 \
            ConsumptionCentralInstaller.zip ConsumptionCentralInstaller.zip.sha256 install.ps1 \
            --repo "$GITHUB_REPOSITORY" --draft --latest=false "${pre[@]}" \
            --notes-file notes/release-notes.md \
            --title "Consumption Central installer ${TAG#consumption-central-installer-v}"

  check-published:
    name: Check the published exe
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'consumption-central-installer-v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download the published exe
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP\published" --pattern ConsumptionCentralInstaller.exe --pattern ConsumptionCentralInstaller.exe.sha256

      - name: Check its signature and hash
        working-directory: 'installer'
        env:
          REQUIRE_SIGNED: ${{ vars.REQUIRE_SIGNED_INSTALLER }}
        run: |
          $require = if ($env:REQUIRE_SIGNED -eq 'true') { '--require-signed' } else { $null }
          node packaging/finish-exe.js "$env:RUNNER_TEMP\published\ConsumptionCentralInstaller.exe" --check-hash $require
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check install.ps1 matches the published zip
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'published'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir --pattern ConsumptionCentralInstaller.zip --pattern ConsumptionCentralInstaller.zip.sha256 --pattern install.ps1
          if ($LASTEXITCODE) { throw 'The release needs ConsumptionCentralInstaller.zip, its .sha256 and install.ps1.' }
          $hash = (Get-FileHash (Join-Path $dir 'ConsumptionCentralInstaller.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
          $listed = ((Get-Content -Raw (Join-Path $dir 'ConsumptionCentralInstaller.zip.sha256')) -split '\s+')[0]
          if ($listed -ne $hash) { throw "ConsumptionCentralInstaller.zip.sha256 says $listed, but the zip's SHA-256 is $hash." }
          if ((Get-Content -Raw (Join-Path $dir 'install.ps1')) -notmatch "\`$Sha256 = '$hash'") { throw "install.ps1 doesn't check for the published zip's SHA-256 $hash." }
          Write-Output "install.ps1 and ConsumptionCentralInstaller.zip match ($hash)"

      - name: Turn the release back into a draft
        if: failure()
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=true
          Write-Output "::error::$env:TAG is a draft again. Fix the exe or its .sha256, then publish it again."

      # Publishing by hand can mark the release Latest. A warning, which can't fail the checks above.
      - name: Check an installer release isn't the repo's Latest
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE) { Write-Output 'The repo has no Latest release.'; exit 0 }
          if ($latest -like 'consumption-central-installer-v*') {
            Write-Output "::warning::$latest is now the repo's Latest release. Nothing in the installer uses Latest, which is for report releases: once there is one, set it as Latest with gh release edit <its tag> --latest."
          }
