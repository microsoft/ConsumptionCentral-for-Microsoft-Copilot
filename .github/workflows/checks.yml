name: Check docs and notebooks

# Several of the exports Consumption Central reads are preview features whose portals
# move, so the docs link out a lot. This catches a broken internal link or a
# notebook that will not parse before a customer hits it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Notebooks are valid JSON and every code cell parses
        run: |
          python - <<'PY'
          import ast, glob, json, os, sys

          bad = 0
          for path in sorted(glob.glob("**/*.ipynb", recursive=True)):
              name = os.path.basename(path)
              try:
                  nb = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  print(f"{name}: INVALID JSON: {e}")
                  bad += 1
                  continue
              for i, c in enumerate(nb["cells"]):
                  if c["cell_type"] != "code":
                      continue
                  try:
                      ast.parse("".join(c["source"]))
                  except SyntaxError as e:
                      print(f"{name} cell {i}: line {e.lineno}: {e.msg}")
                      bad += 1
              print(f"{name}: {len(nb['cells'])} cells")
          sys.exit(1 if bad else 0)
          PY

      - name: Every internal doc link resolves
        run: |
          python - <<'PY'
          import os, re, sys, urllib.parse

          LINK = re.compile(r"\[([^\]]*)\]\(([^)]+)\)")
          HEAD = re.compile(r"^(#{1,6})\s+(.*?)\s*$", re.M)
          # Explicit <a id="..."> targets are just as linkable as headings,
          # and are what a deep link uses when the heading text is unstable.
          ANCHOR = re.compile(r"""<a\s[^>]*\b(?:id|name)\s*=\s*["']([^"']+)["']""", re.I)

          def slug(text):
              # GitHub's heading anchor rules: strip markdown, lowercase,
              # drop punctuation, then one hyphen per space. Runs of spaces
              # are NOT collapsed - "credits - viva" becomes "credits--viva"
              # once the dash is stripped, and collapsing them here would
              # report good links as broken.
              text = re.sub(r"\[([^\]]*)\]\([^)]*\)", r"\1", text)
              text = re.sub(r"[*`_]", "", text).lower().strip()
              text = re.sub(r"[^\w\s-]", "", text)
              return re.sub(r"[ \t]", "-", text)

          docs = {}
          for dirpath, dirnames, filenames in os.walk("."):
              if ".git" in dirpath:
                  continue
              for fn in filenames:
                  if fn.endswith(".md"):
                      p = os.path.normpath(os.path.join(dirpath, fn))
                      body = open(p, encoding="utf-8").read()
                      docs[p] = {slug(m.group(2)) for m in HEAD.finditer(body)}
                      docs[p] |= set(ANCHOR.findall(body))

          missing = []
          ok = 0

          for path in docs:
              text = open(path, encoding="utf-8").read()
              for label, target in LINK.findall(text):
                  if target.startswith(("http", "mailto:")):
                      continue
                  # ../../issues and friends resolve on github.com only
                  if "issues" in target or "stargazers" in target:
                      continue
                  filepart, _, anchor = target.partition("#")
                  filepart = urllib.parse.unquote(filepart.strip())

                  if filepart:
                      resolved = os.path.normpath(
                          os.path.join(os.path.dirname(path), filepart))
                      if not os.path.exists(resolved):
                          missing.append((path, label, target, "no such file"))
                          continue
                  else:
                      resolved = path

                  # A renamed heading leaves every deep link pointing at
                  # nothing, and GitHub just scrolls to the top rather than
                  # erroring - so nobody notices until a reader is confused.
                  if anchor:
                      if resolved not in docs:
                          ok += 1
                          continue
                      if urllib.parse.unquote(anchor) not in docs[resolved]:
                          missing.append((path, label, target, "no such heading"))
                          continue
                  ok += 1

          print(f"{ok} internal links resolve, anchors included")
          for f, label, target, why in missing:
              print(f"BROKEN  {f}: [{label}] -> {target}  ({why})")
          sys.exit(1 if missing else 0)
          PY

      - name: Shipped Azure template contracts
        run: |
          python docs/scripts/check_azure_template_contract.py
          python -m unittest discover -s docs/scripts -p 'test_azure_template_contract.py'

      - name: Templates carry no repeated lineage tag
        run: |
          # A tag repeated inside one collection makes Desktop refuse to open
          # the template at all, and no other check here notices.
          python docs/scripts/check_lineage_tags.py

      - name: Azure notebook request regression tests
        run: python docs/scripts/test_azure_notebook_requests.py

      - name: Local Azure collector regression tests
        run: python "1. Local CSV/test_pull_azure_ai.py"

      - name: Dataverse flow package contract tests
        run: python docs/scripts/test_flow_package.py

      - name: Studio consumption API tests
        run: |
          python docs/scripts/test_pull_studio.py
          python docs/scripts/test_studio_consumption_notebook.py

      - name: Fabric ingestion tests
        run: python docs/scripts/test_fabric_ingestion.py

      - name: Sample data carries no real identifiers
        run: |
          # The sample set is synthetic. This catches a real export being
          # committed by accident, which matters more than any other check here.
          if grep -rIlE '@(microsoft|[a-zA-Z0-9]+\.onmicrosoft)\.com' --include='*.csv' .; then
            echo "A CSV contains what looks like a real tenant address."
            exit 1
          fi
          echo "no real-looking addresses in committed CSVs"
